name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          npm install -g @anthropic-ai/claude-code

      - name: Fetch PR branches
        run: |
          git fetch origin ${{ github.base_ref }}
          git fetch origin ${{ github.head_ref }}

      - name: Run AI Review in Headless Mode
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail

          PROMPT="你是一个资深的Go代码审查员。请分析本次Pull Request中的代码变更，重点关注潜在的bug、不符合Go语言惯用风格的地方、以及性能问题。以Markdown列表的形式，给出你的审查建议。如果没有任何问题，请回复'代码质量很好，没有发现明显问题。'"

          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} | claude -p "$PROMPT" --output-format json > result.json

          if [ $? -ne 0 ]; then
            echo "AI review command failed."
            exit 1
          fi

          REPORT=$(jq -r '.result' result.json)
          echo "report_content<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.review.outputs.report_content }}`;

            if (report && !report.includes("没有发现明显问题")) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### AI Code Review\n\n${report}`
              });
            } else {
              console.log("AI review found no issues, skipping comment.");
            }
